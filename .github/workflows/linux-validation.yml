name: Linux validation

# Manual until the account's included allowance and zero-spend budget are verified.
on:
  workflow_dispatch:
    inputs:
      free_tier_confirmed:
        description: 'I verified remaining Actions allowance and a zero-dollar spending limit'
        required: true
        type: boolean
        default: false
      upload_reports:
        description: 'Upload diagnostic reports for one day (uses artifact storage allowance)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: beat-scholar-linux-validation
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ inputs.free_tier_confirmed }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install build and headless test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config python3-venv unzip \
            libasound2-dev libfontconfig1-dev libfreetype6-dev libgl1-mesa-dev libgtk-3-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev xvfb openbox xauth xdotool x11-utils \
            fonts-lato fonts-urw-base35
          python3 -m venv .venv
          .venv/bin/pip install numpy==2.2.6 Pillow==11.3.0
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned JUCE and pluginval
        run: |
          git clone --depth 1 --branch 8.0.16-security https://github.com/juce-framework/JUCE.git third_party/JUCE
          test "$(git -C third_party/JUCE rev-parse HEAD)" = ea77444750de45e036e0279bb0291144bf8e3688
          curl --fail --location --retry 3 https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Linux.zip -o /tmp/pluginval.zip
          echo 'c01c49d8063965c4c2dea8324468336768f5c9139e0b1caebde14c2400b55352  /tmp/pluginval.zip' | sha256sum --check
          mkdir -p tools/bin
          unzip -q /tmp/pluginval.zip -d tools/bin
          chmod +x tools/bin/pluginval
      - name: Configure and build VST3, standalone and tests
        run: |
          cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBSL_BUILD_TESTS=ON -DBSL_BUILD_PLUGIN=ON \
            -DPython3_EXECUTABLE="$GITHUB_WORKSPACE/.venv/bin/python"
          cmake --build build/ci --parallel 2
      - name: Run core, audio, editor and actual VST3 suites
        run: ctest --test-dir build/ci --output-on-failure --timeout 300 --parallel 1 --output-junit ctest.xml
      - name: Validate the VST3 at strictness 10
        timeout-minutes: 10
        run: |
          xvfb-run -a tools/bin/pluginval --strictness-level 10 --validate-in-process \
            --validate 'build/ci/BeatScholarLinux_artefacts/Release/VST3/Beat Scholar Linux.vst3'
      - name: Check standalone settings and state recall
        timeout-minutes: 5
        run: |
          xvfb-run -a -s '-screen 0 1600x1200x24' python tools/run_standalone_settings_test.py \
            'build/ci/BeatScholarLinux_artefacts/Release/Standalone/Beat Scholar Linux' \
            build/ci/standalone-settings --midi-host build/ci/tools/actual_vst3_host \
            --plugin 'build/ci/BeatScholarLinux_artefacts/Release/VST3/Beat Scholar Linux.vst3'
      - name: Save diagnostics only
        if: ${{ always() && inputs.upload_reports }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-validation-${{ github.run_id }}
          retention-days: 1
          if-no-files-found: warn
          path: |
            build/ci/ctest.xml
            build/ci/Testing/Temporary/LastTest.log
            build/ci/editor-regression/**/*.png
            build/ci/editor-regression/**/*.json
            build/ci/actual-vst3-smoke/report.json
            build/ci/actual-vst3-midi/report.json
            build/ci/standalone-settings/**/*.png
            build/ci/standalone-settings/**/*.json
            build/ci/standalone-settings/**/*.log
