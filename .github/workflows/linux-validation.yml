name: Native reference diagnostic host
on:
  workflow_dispatch:
    inputs:
      free_tier_confirmed:
        description: 'Private repository allowance and zero-dollar spending limit checked'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: native-reference-host
  cancel-in-progress: false
jobs:
  build:
    if: ${{ github.event.repository.private == false || inputs.free_tier_confirmed }}
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare pinned diagnostic dependency
        shell: pwsh
        run: |
          git -c core.autocrlf=false clone --depth 1 --branch 8.0.16-security https://github.com/juce-framework/JUCE.git "$env:RUNNER_TEMP/diagnostic-juce"
          if ($LASTEXITCODE -ne 0) { throw 'JUCE clone failed' }
          python tools/native-reference-host/prepare.py "$env:RUNNER_TEMP/diagnostic-juce"
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic patch failed' }
      - name: Build Windows x64 console host
        shell: pwsh
        run: |
          cmake -S tools/native-reference-host -B "$env:RUNNER_TEMP/diagnostic-build" -A x64 "-DJUCE_SOURCE_DIR=$env:RUNNER_TEMP/diagnostic-juce"
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed' }
          cmake --build "$env:RUNNER_TEMP/diagnostic-build" --config Release --target actual_vst3_host --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Native host build failed' }
      - name: Package diagnostic and source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifact | Out-Null
          Copy-Item "$env:RUNNER_TEMP/diagnostic-build/bin/Release/actual_vst3_host.exe" artifact/
          Copy-Item tools/native-reference-host artifact/source -Recurse
          git -C "$env:RUNNER_TEMP/diagnostic-juce" archive --format=zip --output="$env:GITHUB_WORKSPACE/artifact/JUCE-pinned-source.zip" HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Dependency source archive failed' }
          Get-FileHash artifact/actual_vst3_host.exe -Algorithm SHA256 | Format-List | Out-File artifact/SHA256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-reference-host-windows-x64
          path: artifact/
          if-no-files-found: error
          retention-days: 1
